    deny all;
    return 404;
  }
  location ~* /\.env {
    deny all;
    return 404;
  }
  location = /.env { deny all; return 404; }
  location = /package.json { deny all; return 404; }
  location = /package-lock.json { deny all; return 404; }
  location = /dev-seed.html { deny all; return 404; }
  location = /panels-seed.html { deny all; return 404; }

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "frame-ancestors 'self' https://tagassistant.google.com https://www.tagassistant.google.com https://*.google.com https://googletagmanager.com https://www.googletagmanager.com https://*.googletagmanager.com" always;

  location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }


  # Exact POST /api/auth/avatar — see HTTP block comment (no trailing-slash 301).
  location = /api/auth/avatar {
    proxy_pass http://127.0.0.1:3001/api/auth/avatar;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 10s;
