# petdate.ir — origin for ParsPack WCDN + direct HTTPS
# CDN terminates public TLS. Origin LE cert SANs: petdate.ir + www.petdate.ir.
#
# CDN-friendly rules:
# - www :80 MUST stay HTTP 200 — WCDN Flexible origin pulls use Host www.petdate.ir.
# - Apex http://petdate.ir is DNS-direct to origin today (no WCDN). Redirect that host
#   to HTTPS unless X-Forwarded-Proto=https or a WCDN edge header is present (so a later
#   Flexible pull on apex would not loop). If apex is moved behind Flexible without those
#   headers, switch to a CDN "Always HTTPS" rule and remove the origin apex redirect.
# - Only raw-IP Host headers always redirect to https://petdate.ir (avoids cert-name mismatch UX).
# - HTTPS www → apex 301 (except sitemap.xml / robots.txt) so crawlers hit one host.
#   Also set the same host-redirect in the ParsPack CDN panel for Flexible www visitors.
# - sitemap.xml / robots.txt always 200 on both hosts (do not 301 those documents).
#
# WCDN www 4xx HTML: Flexible www replaces origin JSON 401/4xx with ~50KB "Upstream Error"
# HTML even when Accept: application/json. Origin always sends application/json + nosniff.
# Do NOT 200-wrap API errors. Disable WCDN custom error pages for /api/* in the panel.

map $host $is_raw_ip_host {
  default 0;
  185.110.189.218 1;
  "~^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" 1;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https https;
  http http;
}

# Old /shop/product/p123 → descriptive slug. File is copied to /etc/nginx on deploy.
include /etc/nginx/petdate-shop-product-redirects.map;

# Static hashed / versioned assets — long cache (gzip types live in conf.d/gzip.conf)
# HTML / SW / manifest stay no-cache below.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name petdate.ir www.petdate.ir _;
  client_max_body_size 20m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  # Trust CDN / proxy client IP when present
  set_real_ip_from 185.143.232.0/22;
  set_real_ip_from 188.229.0.0/16;
  set_real_ip_from 5.160.0.0/16;
  set_real_ip_from 79.175.128.0/18;
  set_real_ip_from 164.138.128.0/18;
  set_real_ip_from 37.32.0.0/16;
  set_real_ip_from 46.224.0.0/16;
  set_real_ip_from 91.98.0.0/16;
  set_real_ip_from 94.182.0.0/16;
  set_real_ip_from 2.144.0.0/13;
  set_real_ip_from 185.239.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  root /opt/petdate/packages/web/dist;
  index index.html;
  autoindex off;
  server_tokens off;

  # Block sensitive / VCS / env paths (never serve from SPA root)
  location ~* /\.(env|git|htaccess|htpasswd|DS_Store) {
    deny all;
    return 404;
  }
  location ~* /\.env {
    deny all;
    return 404;
  }
  location = /.env { deny all; return 404; }
  location = /package.json { deny all; return 404; }
  location = /package-lock.json { deny all; return 404; }
  # Dev-only seed pages — never serve on production origin
  location = /dev-seed.html { deny all; return 404; }
  location = /panels-seed.html { deny all; return 404; }

  # Baseline security headers (SPA; CSP kept moderate for Vite/PWA).
  # Prefer CSP frame-ancestors over X-Frame-Options so Google Tag Assistant
  # (tagassistant.google.com) can connect for GTM debug/preview.
  # Do NOT set Cross-Origin-Opener-Policy on HTML — COOP isolates the page and
  # prevents Tag Assistant's debugger window from pairing (gtm_debug / Preview).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "frame-ancestors 'self' https://tagassistant.google.com https://www.tagassistant.google.com https://*.google.com https://googletagmanager.com https://www.googletagmanager.com https://*.googletagmanager.com" always;

  # Raw IP on :80 → HTTPS apex (www stays on :80 for CDN Flexible)
  if ($is_raw_ip_host = 1) {
    return 301 https://petdate.ir$request_uri;
  }

  # Direct visitors to http://petdate.ir → HTTPS. Skip CDN origin pulls.
  set $apex_http_redirect 0;
  if ($host = petdate.ir) {
    set $apex_http_redirect 1;
  }
  if ($http_x_forwarded_proto = https) {
    set $apex_http_redirect 0;
  }
  if ($http_wcdn_edge) {
    set $apex_http_redirect 0;
  }
  if ($apex_http_redirect = 1) {
    return 301 https://petdate.ir$request_uri;
  }

  # /shop/product/p123 → /shop/product/descriptive-slug (apex).
  if ($shop_product_redirect != "") {
    return 301 https://petdate.ir$shop_product_redirect;
  }

  location = /cdn-cgi/health { return 200 "ok\n"; add_header Content-Type text/plain; }
  location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }


  # Exact POST /api/auth/avatar (multipart upload). A prefix location ending in
  # `/avatar/` would 301 `/avatar` → `/avatar/`, and browsers rewrite that POST
  # to GET — dropping the file body ("API error" on profile photo upload).
  location = /api/auth/avatar {
    proxy_pass http://127.0.0.1:3001/api/auth/avatar;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    client_max_body_size 20m;
  }

  # Immutable user avatars — keep upstream Cache-Control (do not force no-store)
  location ^~ /api/auth/avatar/ {
    proxy_pass http://127.0.0.1:3001/api/auth/avatar/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  # WebSocket chat live updates (must stay ahead of /api/)


  # WebSocket chat live updates
  location /api/ws/ {
    proxy_pass http://127.0.0.1:3001/api/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-PetDate-API "1" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Geo for first-party analytics (Cloudflare / CDN)
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
    proxy_set_header X-Country-Code $http_cf_ipcountry;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_intercept_errors on;
    # 4xx stay origin JSON. Do not intercept 401/400 — WCDN may still replace www bodies.
    error_page 502 503 504 = @api_json_error;
  }

  # Never serve HTML/SPA for broken API upstream — clients expect JSON
  location @api_json_error {
    default_type application/json;
    return 502 '{"ok":false,"error":"خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید."}';
  }

  location /rx {
    proxy_pass http://127.0.0.1:3001/rx;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /assets/brand/ {
    proxy_pass http://127.0.0.1:3001/assets/brand/;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  # Brand / pet / media / pepito static files — cacheable (not hashed, so 7d not immutable)
  location ^~ /brand/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  # Stock photos under /pets/*.jpg — AND SPA routes /pets/:id (+ /edit).
  # Never use try_files =404 alone here: that 404'd /pets/35?tab=medical (mobile deep links).
  location ^~ /pets/ {
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|avif)$ {
      add_header Cache-Control "public, max-age=604800" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://tagassistant.google.com https://www.tagassistant.google.com https://*.google.com https://googletagmanager.com https://www.googletagmanager.com https://*.googletagmanager.com" always;
    try_files $uri /index.html;
  }
  location ^~ /media/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location ^~ /pepito/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri =404;
  }

  location = /registerSW.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /offline.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.json {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri /manifest.webmanifest =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /sitemap.xml {
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /robots.txt {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location ^~ /magazine/ {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://tagassistant.google.com https://www.tagassistant.google.com https://*.google.com https://googletagmanager.com https://www.googletagmanager.com https://*.googletagmanager.com" always;
    try_files $uri $uri/index.html /magazine/index.html;
  }

  location ~ ^/shop/(?:cart|orders|stars-pay|card-pay) {
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    add_header Pragma "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/(?:faq|help|shop|adoption|vet-consult|games|invite|auth/login)(?:/|$) {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://tagassistant.google.com https://www.tagassistant.google.com https://*.google.com https://googletagmanager.com https://www.googletagmanager.com https://*.googletagmanager.com" always;
    try_files $uri $uri/index.html /index.html;
  }

  location = / {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://tagassistant.google.com https://www.tagassistant.google.com https://*.google.com https://googletagmanager.com https://www.googletagmanager.com https://*.googletagmanager.com" always;
    try_files /index.html =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    add_header Pragma "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://tagassistant.google.com https://www.tagassistant.google.com https://*.google.com https://googletagmanager.com https://www.googletagmanager.com https://*.googletagmanager.com" always;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name petdate.ir www.petdate.ir _;
  client_max_body_size 20m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  ssl_certificate /etc/letsencrypt/live/petdate.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/petdate.ir/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Raw-IP HTTPS → apex (cert is for petdate.ir, not the IP).
  if ($is_raw_ip_host = 1) {
    return 301 https://petdate.ir$request_uri;
  }

  if ($shop_product_redirect != "") {
    return 301 https://petdate.ir$shop_product_redirect;
  }

  # Visitors on https://www.petdate.ir → apex. Keep sitemap/robots 200 on both hosts.
  set $www_to_apex 0;
  if ($host = www.petdate.ir) {
    set $www_to_apex 1;
  }
  if ($uri = /sitemap.xml) {
    set $www_to_apex 0;
  }
  if ($uri = /robots.txt) {
    set $www_to_apex 0;
  }
  if ($uri = /healthz) {
    set $www_to_apex 0;
  }
  if ($www_to_apex = 1) {
    return 301 https://petdate.ir$request_uri;
  }

  set_real_ip_from 185.143.232.0/22;
