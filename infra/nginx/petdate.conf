  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  location = /registerSW.js {
