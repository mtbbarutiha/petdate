# pdf.petdate.ir — dedicated origin for prescription PDF downloads (SMS links).
# Prefer DNS A → origin IP (185.110.189.218). CDN optional; direct origin is fine.

server {
  listen 80;
  listen [::]:80;
  server_name pdf.petdate.ir;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name pdf.petdate.ir;

  ssl_certificate /etc/letsencrypt/live/pdf.petdate.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pdf.petdate.ir/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  client_max_body_size 8m;

  location /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Canonical SMS path: /rx/{id}.pdf → API
  location ~ ^/rx/([0-9]+)\.pdf$ {
    proxy_pass http://127.0.0.1:3001/rx/$1.pdf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  # Shop invoice SMS path: /inv/{token}.pdf → API
  location ~ ^/inv/([a-fA-F0-9]{16,})\.pdf$ {
    proxy_pass http://127.0.0.1:3001/inv/$1.pdf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  # Legacy / alternate: /rx/{id}/pdf
  location ~ ^/rx/([0-9]+)/pdf$ {
    proxy_pass http://127.0.0.1:3001/rx/$1/pdf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  # Short form: /{id}.pdf
  location ~ ^/([0-9]+)\.pdf$ {
    proxy_pass http://127.0.0.1:3001/rx/$1.pdf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  location / {
    default_type text/plain;
    return 200 "petdate prescription PDF origin\n";
  }
}
