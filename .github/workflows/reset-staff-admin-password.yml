# One-shot: set a staff admin password on the PetDate VPS.
# Reuses the running API's resetEmployeePassword (plain hr_employees.password
# + admin_accounts.password_hash via hashPassword / scrypt).
#
# Required GitHub secrets (same as deploy.yml):
#   VPS_HOST / VPS_USER / VPS_SSH_KEY
# Optional:
#   VPS_PATH   remote app dir (default /opt/petdate)
#
# Uses Environment "production" (may require approval).
# The new password is written only to $GITHUB_STEP_SUMMARY after success —
# do not echo it in job logs. Never commit a real password.
#
# Dispatch after merge:
#   Actions → Reset staff admin password → Run workflow
#   username=leila  (or any hr_employees / admin_accounts username)
#   password=<min 6 chars>
name: Reset staff admin password

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Staff admin username (e.g. leila)'
        required: true
        default: 'leila'
        type: string
      password:
        description: 'New password (min 6). Copied to the job summary only after a successful reset.'
        required: true
        type: string

concurrency:
  group: petdate-vps-deploy
  cancel-in-progress: false

jobs:
  reset:
    name: Reset staff password on VPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Require VPS secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for v in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [[ -z "${!v}" ]]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Set VPS_HOST, VPS_USER, VPS_SSH_KEY in repo Actions secrets (see docs/DEPLOY.md)."
            exit 1
          fi

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            echo "Host petdate-vps"
            echo "  HostName ${VPS_HOST}"
            echo "  User ${VPS_USER}"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Validate inputs
        id: validate
        env:
          USERNAME_IN: ${{ github.event.inputs.username }}
          PASSWORD_IN: ${{ github.event.inputs.password }}
        run: |
          set -euo pipefail
          set +x
          USERNAME="$(printf '%s' "${USERNAME_IN:-}" | tr '[:upper:]' '[:lower:]')"
          USERNAME="${USERNAME#"${USERNAME%%[![:space:]]*}"}"
          USERNAME="${USERNAME%"${USERNAME##*[![:space:]]}"}"
          PASSWORD="${PASSWORD_IN:-}"
          if [[ ! "$USERNAME" =~ ^[a-z0-9._-]{2,64}$ ]]; then
            echo "::error::username must be 2–64 latin characters (a-z 0-9 . _ -)"
            exit 1
          fi
          if [[ "${#PASSWORD}" -lt 6 ]]; then
            echo "::error::password must be at least 6 characters"
            exit 1
          fi
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"

      - name: Reset password on VPS
        env:
          USERNAME: ${{ steps.validate.outputs.username }}
          NEW_PASSWORD: ${{ github.event.inputs.password }}
          VPS_PATH_SECRET: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          set +x
          REMOTE_DIR="${VPS_PATH_SECRET:-/opt/petdate}"
          workdir="$(mktemp -d)"
          chmod 700 "$workdir"
          stamp="petdate-reset-staff-$$-$RANDOM"
          script_local="$workdir/reset.cjs"
          pass_local="$workdir/pass"
          ts_local="$workdir/reset.ts"
          cleanup() {
            shred -u "$workdir"/* 2>/dev/null || true
            rm -rf "$workdir"
          }
          trap cleanup EXIT

          printf '%s' "$NEW_PASSWORD" > "$pass_local"
          chmod 600 "$pass_local"

          # Invokes packages/api dist (resetEmployeePassword + updateAdminAccount).
          # Password is read from RESET_PASSWORD; this file never prints it.
          cat > "$script_local" << 'EOF'
          'use strict';
          const fs = require('fs');
          const path = require('path');

          const root = process.env.REMOTE_DIR || process.cwd();
          const usernameRaw = String(process.env.RESET_USERNAME || '').trim();
          const password = String(process.env.RESET_PASSWORD || '');

          if (password.length < 6) {
            console.error('password must be at least 6 characters');
            process.exit(1);
          }

          process.chdir(root);

          function loadHr() {
            const dist = path.join(root, 'packages/api/dist/hr-service.js');
            if (fs.existsSync(dist)) return require(dist);
            throw new Error('missing packages/api/dist/hr-service.js');
          }

          function loadShared() {
            const dist = path.join(root, 'packages/shared/dist/index.js');
            if (fs.existsSync(dist)) return require(dist);
            const nm = path.join(root, 'node_modules/@petdate/shared');
            if (fs.existsSync(nm)) return require(nm);
            throw new Error('missing @petdate/shared (build shared on the VPS)');
          }

          function loadDb() {
            const dist = path.join(root, 'packages/api/dist/db.js');
            if (fs.existsSync(dist)) return require(dist);
            throw new Error('missing packages/api/dist/db.js');
          }

          const hr = loadHr();
          const shared = loadShared();
          const { getDb } = loadDb();
          const STAFF_AGENTS = shared.STAFF_AGENTS || [];

          const username = hr.sanitizeHrUsername(usernameRaw);
          if (!username) {
            console.error('invalid username');
            process.exit(1);
          }

          const agent = STAFF_AGENTS.find(
            (a) => String(a.username || '').trim().toLowerCase() === username
          );

          const d = getDb();
          const emp = d
            .prepare(
              `SELECT id, username FROM hr_employees
               WHERE lower(trim(username)) = lower(?)
               LIMIT 1`
            )
            .get(username);
          if (!emp) {
            console.error('hr_employees row not found for username');
            process.exit(1);
          }

          const acct = d
            .prepare(
              `SELECT id, username FROM admin_accounts
               WHERE lower(trim(username)) = lower(?)
               LIMIT 1`
            )
            .get(username);
          if (!acct) {
            console.error('admin_accounts row not found for username');
            process.exit(1);
          }

          const next = hr.resetEmployeePassword(Number(emp.id), password);
          if (!next) {
            console.error('resetEmployeePassword failed');
            process.exit(1);
          }
          const stored = hr.getEmployeePlainPassword(Number(emp.id));
          if (stored !== password) {
            console.error('hr_employees.password was not updated');
            process.exit(1);
          }

          const patch = { password, isActive: true };
          if (agent && agent.roleKey) patch.roleKey = agent.roleKey;

          let updated;
          try {
            updated = hr.updateAdminAccount(Number(acct.id), patch);
          } catch (err) {
            console.error(
              'updateAdminAccount failed:',
              err instanceof Error ? err.message : err
            );
            process.exit(1);
          }
          if (!updated) {
            console.error('updateAdminAccount returned null');
            process.exit(1);
          }

          const verify = d
            .prepare(
              `SELECT username, role_key, is_active, password_hash
               FROM admin_accounts WHERE id = ?`
            )
            .get(acct.id);
          if (!verify || Number(verify.is_active) !== 1) {
            console.error('admin_accounts is_active was not set');
            process.exit(1);
          }
          if (!String(verify.password_hash || '').includes(':')) {
            console.error('admin_accounts.password_hash missing or not salt:hash');
            process.exit(1);
          }
          if (agent && String(verify.role_key) !== String(agent.roleKey)) {
            console.error('admin_accounts.role_key was not set to roster role');
            process.exit(1);
          }

          console.log(
            JSON.stringify({
              ok: true,
              username: String(verify.username || username),
              role_key: String(verify.role_key || ''),
              is_active: 1,
            })
          );
          EOF

          cat > "$ts_local" << 'EOF'
          import { STAFF_AGENTS } from '../../shared/src/staff-agents';
          import { getDb } from './src/db';
          import {
            getEmployeePlainPassword,
            resetEmployeePassword,
            sanitizeHrUsername,
            updateAdminAccount,
          } from './src/hr-service';

          const usernameRaw = String(process.env.RESET_USERNAME || '').trim();
          const password = String(process.env.RESET_PASSWORD || '');
          if (password.length < 6) {
            console.error('password must be at least 6 characters');
            process.exit(1);
          }
          const username = sanitizeHrUsername(usernameRaw);
          if (!username) {
            console.error('invalid username');
            process.exit(1);
          }
          const agent = STAFF_AGENTS.find(
            (a) => String(a.username || '').trim().toLowerCase() === username
          );
          const d = getDb();
          const emp = d
            .prepare(
              `SELECT id, username FROM hr_employees
               WHERE lower(trim(username)) = lower(?)
               LIMIT 1`
            )
            .get(username) as { id: number; username: string } | undefined;
          if (!emp) {
            console.error('hr_employees row not found for username');
            process.exit(1);
          }
          const acct = d
            .prepare(
              `SELECT id, username FROM admin_accounts
               WHERE lower(trim(username)) = lower(?)
               LIMIT 1`
            )
            .get(username) as { id: number; username: string } | undefined;
          if (!acct) {
            console.error('admin_accounts row not found for username');
            process.exit(1);
          }
          const next = resetEmployeePassword(Number(emp.id), password);
          if (!next) {
            console.error('resetEmployeePassword failed');
            process.exit(1);
          }
          if (getEmployeePlainPassword(Number(emp.id)) !== password) {
            console.error('hr_employees.password was not updated');
            process.exit(1);
          }
          const patch: { password: string; isActive: boolean; roleKey?: string } = {
            password,
            isActive: true,
          };
          if (agent?.roleKey) patch.roleKey = agent.roleKey;
          let updated;
          try {
            updated = updateAdminAccount(Number(acct.id), patch);
          } catch (err) {
            console.error(
              'updateAdminAccount failed:',
              err instanceof Error ? err.message : err
            );
            process.exit(1);
          }
          if (!updated) {
            console.error('updateAdminAccount returned null');
            process.exit(1);
          }
          const verify = d
            .prepare(
              `SELECT username, role_key, is_active, password_hash
               FROM admin_accounts WHERE id = ?`
            )
            .get(acct.id) as {
            username?: string;
            role_key?: string;
            is_active?: number;
            password_hash?: string;
          };
          if (!verify || Number(verify.is_active) !== 1) {
            console.error('admin_accounts is_active was not set');
            process.exit(1);
          }
          if (!String(verify.password_hash || '').includes(':')) {
            console.error('admin_accounts.password_hash missing or not salt:hash');
            process.exit(1);
          }
          if (agent && String(verify.role_key) !== String(agent.roleKey)) {
            console.error('admin_accounts.role_key was not set to roster role');
            process.exit(1);
          }
          console.log(
            JSON.stringify({
              ok: true,
              username: String(verify.username || username),
              role_key: String(verify.role_key || ''),
              is_active: 1,
            })
          );
          EOF

          scp -q "$script_local" "petdate-vps:/tmp/${stamp}.cjs"
          scp -q "$ts_local" "petdate-vps:/tmp/${stamp}.ts"
          scp -q "$pass_local" "petdate-vps:/tmp/${stamp}.pass"

          result="$(
            ssh petdate-vps \
              "REMOTE_DIR=$(printf '%q' "$REMOTE_DIR") RESET_USERNAME=$(printf '%q' "$USERNAME") SCRIPT=/tmp/${stamp}.cjs PASSFILE=/tmp/${stamp}.pass TSFILE=/tmp/${stamp}.ts bash -s" << 'REMOTE'
          set -euo pipefail
          set +x
          cleanup_remote() {
            rm -f "${PASSFILE:-}" "${SCRIPT:-}" "${TSFILE:-}" \
              "${REMOTE_DIR:-/opt/petdate}/packages/api/.tmp-reset-staff-admin.ts"
          }
          trap cleanup_remote EXIT

          if [[ -z "${PASSFILE:-}" || ! -f "$PASSFILE" ]]; then
            echo "password file missing on VPS" >&2
            exit 1
          fi
          RESET_PASSWORD="$(cat "$PASSFILE")"
          rm -f "$PASSFILE"
          export RESET_PASSWORD RESET_USERNAME REMOTE_DIR
          if [[ "${#RESET_PASSWORD}" -lt 6 ]]; then
            echo "password must be at least 6 characters" >&2
            exit 1
          fi

          cd "$REMOTE_DIR"
          if [[ -f scripts/lib/load-env.sh ]]; then
            # shellcheck disable=SC1091
            source scripts/lib/load-env.sh
            load_env "${REMOTE_DIR}/.env" || true
          fi
          export NODE_ENV="${NODE_ENV:-production}"
          export DATABASE_PATH="${DATABASE_PATH:-${REMOTE_DIR}/packages/api/data/petdate.db}"

          if [[ -f packages/api/dist/hr-service.js ]]; then
            node "$SCRIPT"
          else
            echo "packages/api/dist/hr-service.js missing — falling back to npx tsx" >&2
            cp "$TSFILE" packages/api/.tmp-reset-staff-admin.ts
            (cd packages/api && npx --yes tsx .tmp-reset-staff-admin.ts)
          fi
          REMOTE
          )"

          echo "$result"
          if ! printf '%s' "$result" | grep -q '"ok":true'; then
            echo "::error::staff password reset failed (user missing or update failed)"
            exit 1
          fi

          html_escape() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }
          {
            echo "## Staff admin password reset"
            echo ""
            echo "Password was set on the VPS for both \`hr_employees.password\` (plain) and \`admin_accounts.password_hash\` (same \`hashPassword\` / \`resetEmployeePassword\` path as the API)."
            echo ""
            echo "<p><strong>username:</strong> <code>$(html_escape "$USERNAME")</code></p>"
            echo "<p><strong>password:</strong> <code>$(html_escape "$NEW_PASSWORD")</code></p>"
            echo ""
            echo "Give this login to the staff member once. Do not commit the password."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Password set for username=${USERNAME}. Credentials written to the job summary only."
