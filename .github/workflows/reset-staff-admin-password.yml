name: Reset staff admin password
on:
  workflow_dispatch:
    inputs:
      username:
        description: Staff admin username (e.g. leila)
        required: true
        default: leila
      password:
        description: New plain password (min 6 chars)
        required: true
jobs:
  reset:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH reset on VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH_SECRET: ${{ secrets.VPS_PATH }}
          STAFF_USER: ${{ inputs.username }}
          STAFF_PASS: ${{ inputs.password }}
        run: |
          set -euo pipefail
          for v in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [[ -z "${!v}" ]]; then echo "::error::missing $v"; exit 1; fi
          done
          if [[ ${#STAFF_PASS} -lt 6 ]]; then echo "::error::password too short"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            echo "Host petdate-vps"
            echo "  HostName ${VPS_HOST}"
            echo "  User ${VPS_USER}"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          REMOTE_DIR="${VPS_PATH_SECRET:-/opt/petdate}"
          scp scripts/reset-staff-admin-password.mjs petdate-vps:/tmp/reset-staff-admin-password.mjs
          OUT=$(ssh petdate-vps "bash -lc $(printf '%q' "cd $(printf '%q' "$REMOTE_DIR") && (test -f .env && set -a && . ./.env && set +a; true) && export STAFF_USER=$(printf '%q' "$STAFF_USER") STAFF_PASS=$(printf '%q' "$STAFF_PASS") && node /tmp/reset-staff-admin-password.mjs")")
          echo "$OUT"
          {
            echo "## Staff password reset"
            echo ""
            echo "- username: \`$STAFF_USER\`"
            echo "- password: \`$STAFF_PASS\`"
            echo "- remote: \`$OUT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$OUT" | grep -Eq '"ok":[[:space:]]*true' || { echo "::error::reset failed: $OUT"; exit 1; }