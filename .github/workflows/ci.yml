# PetDate CI — lint/typecheck/build on every PR and feature-branch push.
# Does NOT deploy. Deploy is only via deploy.yml (main/master + approval).
#
# Note: push to main/master is intentionally NOT listed here — deploy.yml
# already builds the same monorepo before shipping. Listing both caused two
# "Build monorepo" checks (~2× wall-clock) on every main merge.
name: CI

on:
  pull_request:
  push:
    branches:
      - 'cursor/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Voice chat uploads convert webm/m4a → OGG/Opus (Telegram sendVoice).
      - name: Install ffmpeg (voice → ogg)
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg

      - name: Build shared → api → bot → web
        run: npm run build:all

      - name: API selftests (safe / no VPS)
        run: bash ./scripts/ci-selftest.sh

      - name: Predeploy integrity check (informational on feature branches)
        env:
          ALLOW_DEPLOY: '1'
        run: bash ./scripts/predeploy-check.sh
