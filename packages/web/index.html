    <!-- Prevent flash of wrong theme before CSS/JS hydrate -->
    <script>
      (function () {
        try {
          if (location.hostname === 'www.petdate.ir') {
            location.replace('https://petdate.ir' + location.pathname + location.search + location.hash);
            return;
          }
        } catch (e0) {}
        try {
          var key = 'petdate-theme';
          var stored = null;
          try {
            stored = localStorage.getItem(key);
          } catch (e) {}
          /* Default template = dark when no stored preference (ignore OS scheme). */
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1d27' : '#5c4d91');
          var scheme = document.querySelector('meta[name="color-scheme"]');
          if (scheme) scheme.setAttribute('content', theme);

          var langKey = 'petdate-lang';
          var langStored = null;
          try {
            langStored = localStorage.getItem(langKey);
          } catch (e2) {}
          var lang = langStored === 'en' || langStored === 'fa' ? langStored : 'fa';
          root.setAttribute('lang', lang);
          root.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
        } catch (e) {}
      })();
    </script>
