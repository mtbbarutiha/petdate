    <script id="pd-boot-hero-from-api">
      (function () {
        try {
          var p = location.pathname || '/';
          if (p !== '/' && p !== '') return;
          var img = document.getElementById('pd-boot-lcp');
          if (!img) return;
          /* Snapshot first (zero network). Defer /api/hero until after load. */
          function applySlide(slide, fromApi) {
            if (!slide || !slide.webp) return;
            /* React parks on slide change / leave — never revive the node after that (LCP delay). */
            if (img.getAttribute('data-pd-react-owned') === '1' || img.classList.contains('is-parked')) {
              return;
            }
            if (slide.srcSet) img.setAttribute('srcset', slide.srcSet);
            else img.removeAttribute('srcset');
            img.setAttribute('sizes', '100vw');
            if (img.getAttribute('src') !== slide.webp) img.setAttribute('src', slide.webp);
            img.setAttribute('data-pd-boot-hero', fromApi ? 'api' : 'snapshot');
            if (typeof slide.posX === 'number' && typeof slide.posY === 'number') {
              img.style.objectPosition = slide.posX + '% ' + slide.posY + '%';
            }
            if (typeof slide.scale === 'number' && slide.scale > 0 && slide.scale !== 1) {
              img.style.transform = 'scale(' + slide.scale + ')';
              img.style.transformOrigin =
                (typeof slide.posX === 'number' ? slide.posX : 50) +
                '% ' +
                (typeof slide.posY === 'number' ? slide.posY : 0) +
                '%';
            } else {
              img.style.transform = '';
            }
            var existing = document.querySelector('link[data-pd-lcp="hero"]');
            if (existing) {
              if (existing.getAttribute('href') !== slide.webp) {
                existing.setAttribute('href', slide.webp);
                if (slide.srcSet) existing.setAttribute('imagesrcset', slide.srcSet);
              }
              return;
            }
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.type = 'image/webp';
            link.href = slide.webp;
            if (slide.srcSet) link.setAttribute('imagesrcset', slide.srcSet);
            link.setAttribute('imagesizes', '100vw');
            link.setAttribute('fetchpriority', 'high');
            link.setAttribute('data-pd-lcp', 'hero');
            var fontPreload = document.querySelector('link[rel="preload"][as="font"]');

              fontPreload.parentNode.insertBefore(link, fontPreload);
            } else {
              document.head.appendChild(link);

            if (img.getAttribute('data-pd-react-owned') === '1' || img.classList.contains('is-parked')) {

            fetch('/api/hero', { credentials: 'same-origin' })

                return r.ok ? r.json() : null;

                var slides = data && data.slides;
                if (!slides || !slides.length) return;
                var slide = slides[0];
                if (
                  img.getAttribute('data-pd-react-owned') !== '1' &&

                  applySlide(slide, true);

                try {
                  var bootEl = document.getElementById('pd-hero-boot-json');
                  if (bootEl) {
                    var snap = {
                      webp: slide.webp,
                      srcSet: slide.srcSet || '',
                      fallback: slide.fallback || slide.webp,
                      posX: typeof slide.posX === 'number' ? slide.posX : 50,
                      posY: typeof slide.posY === 'number' ? slide.posY : 0,
                      scale: typeof slide.scale === 'number' ? slide.scale : 1,
                      updatedAt: new Date().toISOString(),
                      slides: slides,
                    };
                    bootEl.textContent = JSON.stringify(snap);
                  }
                  window.dispatchEvent(
                    new CustomEvent('pd-hero-slides', { detail: { slides: slides } }),
